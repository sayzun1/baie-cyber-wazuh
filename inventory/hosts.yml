---
# =============================================================================
# Inventaire du projet "Baie réseau cyber"
# -----------------------------------------------------------------------------
# 2 catégories de cibles :
#   1. proxmox      -> l'hyperviseur, piloté via son API (connexion locale)
#   2. vms          -> les machines virtuelles Linux une fois créées
# =============================================================================

all:
  children:

    # -------------------------------------------------------------------------
    # L'hyperviseur Proxmox.
    # On ne se connecte PAS en SSH dessus pour créer les VM : les modules
    # community.general.proxmox_* parlent à l'API depuis la machine Ansible.
    # D'où ansible_connection=local sur ce groupe.
    # -------------------------------------------------------------------------
    proxmox:
      hosts:
        pve01:
          ansible_connection: local
          ansible_host: 127.0.0.1
          # Nom du noeud tel qu'il apparaît dans l'interface Proxmox
          pve_node: "pve01"

    # -------------------------------------------------------------------------
    # Les VM déployées. Ce groupe est alimenté :
    #   - dynamiquement par le playbook de création (add_host)
    #   - manuellement ici une fois les machines stabilisées
    # -------------------------------------------------------------------------
    vms:
      children:

        # --- Zone LAN interne -------------------------------------------------
        lan:
          hosts:
            srv-dns01:
              ansible_host: 192.168.10.11
              vm_id: 111
              vm_ip: "192.168.10.11/24"
              vm_gateway: "192.168.10.254"
              vm_bridge: "vmbr1"
            srv-web01:
              ansible_host: 192.168.10.20
              vm_id: 120
              vm_ip: "192.168.10.20/24"
              vm_gateway: "192.168.10.254"
              vm_bridge: "vmbr1"

        # --- Zone DMZ ---------------------------------------------------------
        dmz:
          hosts:
            srv-proxy01:
              ansible_host: 172.16.0.10
              vm_id: 210
              vm_ip: "172.16.0.10/24"
              vm_gateway: "172.16.0.254"
              vm_bridge: "vmbr2"

        # --- Zone administration / supervision --------------------------------
        admin:
          hosts:
            srv-siem01:
              ansible_host: 10.0.0.30
              vm_id: 330
              vm_ip: "10.0.0.30/24"
              vm_gateway: "10.0.0.254"
              vm_bridge: "vmbr3"
              vm_cores: 4
              vm_memory: 8192
              vm_disk: 100
