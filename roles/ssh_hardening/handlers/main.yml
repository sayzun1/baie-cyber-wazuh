---
# Les handlers ne s'exécutent qu'une fois, en fin de play, et seulement
# si une tâche les a notifiés.

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: restart sshd

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: restart fail2ban

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
  listen: reload nftables
